name: Status do commit
description: >-
  Publica o andamento deste workflow como status do commit. O fluxo da issue dispara o CI
  e o E2E com workflow_dispatch, e o Pull Request só mostra essas execuções como status.

inputs:
  context:
    description: Nome que aparece nos checks do Pull Request.
    required: true
  state:
    description: pending, success, failure ou cancelled (o job.status).
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CONTEXT: ${{ inputs.context }}
        STATE: ${{ inputs.state }}
      run: |
        case "$STATE" in
          pending) description='Rodando…' ;;
          success) description='Passou' ;;
          failure) description='Falhou' ;;
          *) STATE=error; description='Interrompido' ;;
        esac
        gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" --silent \
          -f state="$STATE" -f context="$CONTEXT" -f description="$description" \
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
