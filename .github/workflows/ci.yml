name: CI

# Checagens rápidas e sem internet: nada aqui depende do DemoQA.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos, unitários e autotestes do agente
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint e formatação (Biome)
        run: npx biome ci .

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Checar tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test:unit

      - name: Features em sincronia com as histórias
        run: npm run stories:check

      - name: Autotestes do agente (defeitos plantados)
        run: npm run test:agent

      - name: Guardar relatório dos autotestes
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: autotestes-agente
          path: |
            reports/agent-self-test/
            test-results/
          retention-days: 7
